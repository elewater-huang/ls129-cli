; LS129CLI V0.1 - read-only. Store next to LS129CLI.exe.
; Port number should match Windows Device Manager.
[Communication]
port=COM3
baud_rate=9600
station_id=1
timeout_ms=1000

[Acquisition]
; PC-side polling, not the instrument's internal sampling frequency.
; Accepts positive decimals up to 32, e.g. 0.2, 1, 5, 32.
poll_hz=5

[Calibration]
; PC-side correction only; never written to LS129 hardware.
enabled=0
factor=1.0000

[System]
; Reserved for future UI integration, not interpreted by V0.1.
language=zh-TW
